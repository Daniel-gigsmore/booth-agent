name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # sharp's text rendering goes through fontconfig. On some Windows
      # runners it finds no writable cache directory, so every test process
      # rescans every system font - fonts.test.ts went from 72 ms to 19 s and
      # tests timed out. The agent always passes the bundled font file itself,
      # so point fontconfig at just those fonts and a cache it can write.
      - name: Point fontconfig at the bundled fonts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          conf="$RUNNER_TEMP/fonts.conf"
          mkdir -p "$RUNNER_TEMP/fontconfig-cache"
          cat > "$conf" <<EOF
          <?xml version="1.0"?>
          <fontconfig>
            <dir>$(cygpath -m "$GITHUB_WORKSPACE/assets/fonts")</dir>
            <cachedir>$(cygpath -m "$RUNNER_TEMP/fontconfig-cache")</cachedir>
          </fontconfig>
          EOF
          echo "FONTCONFIG_FILE=$(cygpath -m "$conf")" >> "$GITHUB_ENV"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix kiosk
      - run: npm run build --prefix kiosk

  # Branch protection requires a status check literally named "test" - a
  # matrix job reports as "test-matrix (ubuntu-latest)" /
  # "test-matrix (windows-latest)" instead, which the rule wouldn't
  # recognize. This gate depends on every matrix combination, so it only
  # goes green once both platforms pass, and it's what stays wired into
  # branch protection instead of the matrix job itself.
  test:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI matrix jobs passed."
